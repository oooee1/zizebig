        /* 修改原本的 @keyframes shake */
@keyframes shake {
  0% { transform: scale(1.05) translate(0, 0) rotate(0deg); }
  20% { transform: scale(1.05) translate(-12px, 6px) rotate(-1deg); }
  40% { transform: scale(1.05) translate(12px, -6px) rotate(1deg); }
  60% { transform: scale(1.05) translate(-8px, -3px) rotate(-0.5deg); }
  80% { transform: scale(1.05) translate(8px, 3px) rotate(0.5deg); }
  100% { transform: scale(1) translate(0, 0) rotate(0deg); }
}

/* 搖晃套用時 */
.is-shaking {
  animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both !important;
}
/* 「碰!!!一大下」強烈撞擊動畫 */
@keyframes heavyImpact {
  0% { transform: scale(1.05) translate(0, 0) rotate(0deg); filter: brightness(1); }
  10% { transform: scale(1.15) translate(-25px, 15px) rotate(-3deg); filter: brightness(2); } /* 瞬間放大+閃亮 */

  30% { transform: scale(1.10) translate(-20px, -10px) rotate(-2deg); filter: brightness(1.2); }
  40% { transform: scale(1.08) translate(20px, 10px) rotate(2deg); filter: brightness(1); }
  60% { transform: scale(1.06) translate(-10px, 5px) rotate(-1deg); }
  80% { transform: scale(1.05) translate(5px, -3px) rotate(0.5deg); }
  100% { transform: scale(1) translate(0, 0) rotate(0deg); filter: brightness(1); }
}

/* 撞擊動畫 Class (只加在背景容器) */

        #page1.同情星顫抖哭 .角色圖.全同情星 img {

/* 🎭 角色登場動畫（取消 infinite，只播放 1 次 / 苦惱改為沉下去+發抖） */

/* 微笑/感動：輕微彈跳 1 次 */
@keyframes bounce-once {
  0% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0); }
}

/* 思考：輕微左右搖晃 1 次 */
@keyframes sway-once {
  0% { transform: rotate(0deg); }
  25% { transform: rotate(-2deg); }
  75% { transform: rotate(2deg); }
  100% { transform: rotate(0deg); }
}

/* 苦惱：垂頭喪氣（下沉 + 微幅沮喪發抖） */
@keyframes depress-down {
  0% { transform: translateY(0) rotate(0deg); }
  30% { transform: translateY(12px) rotate(-2deg); }
  50% { transform: translateY(15px) rotate(1deg); }
  70% { transform: translateY(13px) rotate(-1deg); }
  100% { transform: translateY(15px) rotate(-2deg); } /* 停留在沉下去的狀態 */
}

/* 哭泣：劇烈發抖 1 次 */
@keyframes cry-once {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(-3px, 1px); }
  40% { transform: translate(3px, -1px); }
  60% { transform: translate(-3px, -1px); }
  80% { transform: translate(3px, 1px); }
}

/* 點頭/說話：點頭 1 次 */
@keyframes talk-once {
  0% { transform: translateY(0); }
  50% { transform: translateY(6px); }
  100% { transform: translateY(0); }
}

/* 🎭 激烈開心的 Q 彈跳躍動畫 */
@keyframes excited-bounce-smooth {
  0%   { transform: translateY(0) scale(1, 1); }
  15%  { transform: translateY(4px) scale(1.08, 0.92); }  /* 向下蓄力壓扁 */
  35%  { transform: translateY(-30px) scale(0.92, 1.08); } /* 高高彈起拉長 */
  55%  { transform: translateY(0) scale(1.05, 0.95); }   /* 落地緩衝 */
  70%  { transform: translateY(-12px) scale(0.98, 1.02); } /* 順勢小跳 */
  85%  { transform: translateY(0) scale(1.02, 0.98); }   /* 再次落地 */
  100% { transform: translateY(0) scale(1, 1); }          /* 恢復完美原狀 */
}

/* 動畫只作用在立繪圖片，不動角色容器的位置／transform。
   這樣不會被角色定位用的 !important 覆蓋，動畫結束也能保留 forwards 的最終姿勢。 */
.anim-excited,
.anim-bounce,
.anim-sway,
.anim-depress,
.anim-cry {
  display: block !important;
  animation: none !important;
}

.anim-excited img {
  animation: excited-bounce-smooth 0.8s ease-out forwards !important;
  transform-origin: bottom center;
}

.anim-bounce img {
  animation: bounce-once 0.8s ease-in-out forwards !important;
  transform-origin: bottom center;
}

.anim-sway img {
  animation: sway-once 1s ease-in-out forwards !important;
  transform-origin: bottom center;
}

.anim-depress img {
  animation: depress-down 1.2s ease-out forwards !important;
  transform-origin: bottom center;
}

.anim-cry img {
  animation: cry-once 0.6s ease-in-out forwards !important;
  transform-origin: center center;
}


        /* 熱情星專屬動畫：火焰眼睛更有活力；戴皇冠時更開心、更有慶祝感。 */

.anim-crowned-king img {

/* ------------------------------------------
   💬 3. 對話框與名字（外框共用底色融合）
   ------------------------------------------ */

/* 1. 包裹容器：定位整個對話框區域，並統一施加黑色外邊緣濾鏡 */
.dialog-wrapper {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 35%;
    z-index: 999;
    pointer-events: none;
    /* 💡 已完全移除 filter: drop-shadow(...) */
}

.dialog-wrapper * {
    pointer-events: auto; /* 恢復子元素的點擊事件 */
}

/* 2. 對話框本體 */
#對話框 {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 250px;
    /* 💡 將 0.95 改為 0.7（代表 70% 不透明度 / 30% 半透明），可依喜好微調 */
    background: linear-gradient(
        to bottom, 
        rgba(0, 0, 0, 0.95) 0%,   /* 頂部深灰色（85% 不透明） */
        rgba(15, 15, 15, 0.85) 100%     /* 底部極深黑（95% 不透明） */
    );
    
    clip-path: polygon(0% 0%, 100% 15%, 100% 100%, 0% 100%);
    z-index: 999;
}



/* 💡 新增這段：當對話框隱藏時，SVG 名字標籤也一併隱藏 */
/* 💡 當 page1 被加上 hide-dialog 時，強制隱藏對話框與名字 SVG */
#page1.hide-dialog #對話框,
#page1.hide-dialog #對話框那條線,
#page1.hide-dialog .player-svg {
    display: none !important;
}


#對話框那條線 {
    position: absolute;
    top: auto;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 10px;
    background-color: #ffb30f;
    z-index: 1099;
}

/* 對話框右下角的推進箭頭；等待素材時切換成旋轉圓圈 */
#dialogue-next-arrow {
    position: absolute;
    right: 24px;
    bottom: 22px;
    z-index: 1100;

        (() => {
            const showStartupError = message => {
                // 不在遊戲畫面顯示啟動錯誤文字，保留 Console 診斷方便日後排查。
                console.error('[zizebig 啟動診斷]', message);
            };
            window.addEventListener('error', event => {
                if (event && (event.message || event.error)) {
                    showStartupError(event.message || event.error);
                }
            });
            window.addEventListener('unhandledrejection', event => {
                showStartupError(event.reason && (event.reason.message || event.reason) || '未處理的非同步錯誤');
            });
            window.setTimeout(() => {
                const percent = document.getElementById('loading-percent');
                if (percent && percent.textContent.trim() === '0%') {
                    showStartupError('啟動沒有開始；請截圖這行訊息回傳');
                }
            }, 20000);
        })();

        // 啟動時預載「問題」資料夾的全部題目介面圖片，以及第一幕需要的劇情素材。
        // 其他劇情場景仍維持進入前才預載，避免一次下載整個 pct 資料夾。
        let loadedCount = 0;
        let totalCritical = 1;
        const assetLoadPromises = new Map();
        const readySceneIndexes = new Set();
        const pendingSceneLoads = new Map();

        // 場景素材載入中時鎖住劇情推進，避免連點把對話跳過。
        let sceneTransitionLoading = false;
        let sceneTransitionTarget = null;


        function preloadImages(array, callback, strictTimeout = false) {
            const unique = [...new Set((array || []).filter(Boolean))];
            totalCritical = Math.max(unique.length, 1);
            loadedCount = 0;

            const updateProgress = () => {
                loadedCount++;
                const percent = Math.min(
                    100,
                    Math.floor((loadedCount / totalCritical) * 100)
                );
                const bar = document.getElementById('progress-bar');
                const text = document.getElementById('loading-percent');

                if (bar) bar.style.width = percent + "%";
                if (text) text.innerText = percent + "%";
            };

            if (unique.length === 0) {
                if (typeof callback === "function") callback();
                return;
            }

            Promise.all(unique.map(src => {
                // 舊的載入工作若一直沒有回應，也不能讓整個啟動畫面永遠停住。
                const settleWithinLimit = promise => Promise.race([
                    promise,
                    new Promise((resolve, reject) => setTimeout(() => {
                        const error = new Error("圖片載入逾時：" + src);
                        console.warn(error.message);
                        if (strictTimeout) reject(error);
                        else resolve();
                    }, 12000))
                ]);

                if (assetLoadPromises.has(src)) {
                    return settleWithinLimit(assetLoadPromises.get(src)).then(updateProgress);
                }

                const promise = new Promise((resolve, reject) => {
                    const img = new Image();
                    let settled = false;
                    const finish = error => {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timeoutId);
                        if (error) reject(error);
                        else resolve();
                    };
                    const timeoutId = setTimeout(() => {
                        const error = new Error("圖片載入逾時：" + src);
                        console.warn(error.message);
                        if (strictTimeout) finish(error);
                        else finish();
                    }, 12000);

                    img.decoding = "async";
                    // 圖片下載或解碼沒有回應時，逾時後仍會繼續啟動。
                    img.onload = () => {
                        if (typeof img.decode === "function") {
                            img.decode().catch(() => {}).finally(finish);
                        } else {
                            finish();
                        }
                    };
                    img.onerror = () => finish();
                    img.src = src;
                });

                assetLoadPromises.set(src, promise);
                return promise.then(updateProgress);
            })).then(() => {
                if (typeof callback === "function") callback();
            }).catch(error => {
                console.error("圖片預載發生錯誤：", error);
                if (typeof callback === "function") callback(error);
            });
        }

function activateImages(container) { if (!container) return; container.querySelectorAll('img[data-src]').forEach(img => { const src = img.getAttribute('data-src'); if (src && !img.getAttribute('src')) { img.setAttribute('src', src); img.decoding = "async"; } }); }

        // 預載「問題」資料夾的所有題目介面圖片，確保拼圖選擇與確認畫面出現前素材已載入。
        function getQuestionAssetPaths() {
            const paths = [];
            document.querySelectorAll('img[src*="./問題/"], img[data-src*="./問題/"]').forEach(img => {
                const src = img.getAttribute('src') || img.getAttribute('data-src');
                if (src) paths.push(src);
            });
            return [...new Set(paths.filter(Boolean))];
        }

        function getSceneAssetPaths(stepIndex) {
            const scene = storyScript[stepIndex];
            if (!scene) return [];
            const paths = [];
            const bgId = scene.background || '好奇星草原';
            const bg = document.getElementById(bgId);
            if (bg) bg.querySelectorAll('img[data-src]').forEach(img => paths.push(img.getAttribute('data-src')));
            if (Array.isArray(scene.characters)) scene.characters.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.querySelectorAll('img[data-src]').forEach(img => paths.push(img.getAttribute('data-src')));
            });
            if (Array.isArray(scene.comicImages)) paths.push(...scene.comicImages);

            // 進入計分題時，一次準備好題目介面素材，避免拼圖與確認畫面逐張跑出來。
            const hasScoredOptions = Array.isArray(scene.options) && scene.options.some(
                opt => opt.score && Object.keys(opt.score).length > 0
            );
            if (hasScoredOptions) paths.push(...getQuestionAssetPaths());

            return [...new Set(paths.filter(Boolean))];
        }

function preloadSceneAssets(stepIndex, callback) { if (readySceneIndexes.has(stepIndex)) { if (typeof callback === "function") callback(); return; } let pending = pendingSceneLoads.get(stepIndex); if (!pending) { pending = new Promise(resolve => { preloadImages(getSceneAssetPaths(stepIndex), resolve); }).then(() => { readySceneIndexes.add(stepIndex); pendingSceneLoads.delete(stepIndex); }); pendingSceneLoads.set(stepIndex, pending); } if (typeof callback === "function") pending.then(callback); }

const minLoadingTime = 1000; 
const startTime = Date.now();

function enterGameAnimation() {
    const elapsedTime = Date.now() - startTime;
    const remainingTime = Math.max(0, minLoadingTime - elapsedTime);

    // 確保至少過了 minLoadingTime 毫秒後才淡出隱藏
    setTimeout(() => {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
            loadingScreen.style.opacity = '0';
            loadingScreen.style.transition = 'opacity 0.8s ease';
            setTimeout(() => { 
                loadingScreen.style.display = 'none'; 
            }, 800);
        }
    }, remainingTime);
}

            const textTag = document.getElementById("對話文本");
            if (!textTag) return;

            if (window.myTypingTimer) {
                clearInterval(window.myTypingTimer);
                window.myTypingTimer = null;
            }

            let formattedText = (text || "")
                .replace(/\{playerName\}/g, window.playerName || "")
                .replace(/\(玩家名稱\)/g, window.playerName || "")
                .replace(/（玩家名稱）/g, window.playerName || "");

            window.currentFullText = formattedText;
            window.isTyping = true;
            textTag.innerHTML = ""; 

            let index = 0;
            window.myTypingTimer = setInterval(() => {
                if (!window.isTyping) {
                    clearInterval(window.myTypingTimer);
                    window.myTypingTimer = null;
                    return;
                }

                if (index < formattedText.length) {
                    textTag.innerHTML += formattedText.charAt(index);
                    index++;
                } else {
                    clearInterval(window.myTypingTimer);
                    window.myTypingTimer = null;
                    window.isTyping = false;
                    if (typeof callback === "function") callback();
                }
            }, 30);
        }


function renderScene(stepIndex) {
    const scene = storyScript[stepIndex];
    if (!scene) return;

    // 每次切換場景先取消上一幕的純背景提示。
    if (window.emptySceneHintTimer) {
        clearTimeout(window.emptySceneHintTimer);
        window.emptySceneHintTimer = null;
    }
    const emptyHintPage = document.getElementById('page1');
    if (emptyHintPage) emptyHintPage.classList.remove('show-empty-scene-hint');
    const emptyHintElement = document.getElementById('empty-scene-next-hint');
    if (emptyHintElement) emptyHintElement.style.display = 'none';

    if (!readySceneIndexes.has(stepIndex)) {
        // 同一幕正在載入時，不重複建立等待流程。
        if (sceneTransitionLoading && sceneTransitionTarget === stepIndex) return;

        sceneTransitionLoading = true;
        sceneTransitionTarget = stepIndex;
        const page = document.getElementById('page1');
        if (page) page.classList.add('scene-assets-loading');

        preloadSceneAssets(stepIndex, () => {
            // 只解鎖目前等待的那一幕，避免較舊的載入回呼干擾新場景。
            if (sceneTransitionTarget !== stepIndex) return;
            sceneTransitionLoading = false;
            sceneTransitionTarget = null;
            if (page) page.classList.remove('scene-assets-loading');

            if (currentStep === stepIndex) renderScene(stepIndex);
        });
        return;
    }

    const currentSceneId = scene.id !== undefined ? Number(scene.id) : null;
    const hasText = typeof scene.text === "string" && scene.text.trim() !== "";
    // 對話若以「角色名稱：」開頭，發言者以文字標示為準，不沿用上一幕角色名稱。
    const rawDialogueText = typeof scene.text === "string" ? scene.text.replace(/\/\/n|\\n/g, String.fromCharCode(10)) : "";
    const speakerPrefixMatch = rawDialogueText.match(/^([^：:]{1,12})[：:]\s*/);
    const inferredSpeaker = speakerPrefixMatch ? speakerPrefixMatch[1].replace(/^[🤬😡😠😰😨😱\s]+/, "").trim() : "";
    // 有角色立繪時，若本幕沒有明確指定說話人，就依立繪名稱判定說話人。
    // 若同時有多個立繪，沿用 characters 陣列中的第一個角色；明確的 scene.speaker 仍優先。
    const characterSpeakerName = Array.isArray(scene.characters) && scene.characters.length
        ? String(scene.characters[0])
        : "";
    const inferredCharacterSpeaker = (() => {
        const name = characterSpeakerName.replace(/開心|害怕|嚇死了?|驕傲|點頭|哭泣|慌張|生氣|憤怒|焦慮|緊張|難過|大哭|顫抖哭|爆哭|普通|立繪|選項用/g, "");
        if (/星辰|玩家/.test(name)) return "星辰";
        if (name.includes("好奇星")) return name.includes("路人") ? "路人好奇星" : name.includes("們") ? "好奇星們" : "好奇星";
        if (name.includes("同情星")) return "同情星";
        if (name.includes("爽快星")) return "爽快星";
        if (name.includes("熱情星")) return "熱情星";
        if (name.includes("母親") || name.includes("媽媽")) return "母親";
        if (name.includes("父親") || name.includes("爸爸")) return "父親";
        if (name.includes("煩躁的居民")) return "煩躁的居民";
        if (name.includes("慌張的居民")) return "慌張的居民";
        if (name.includes("害怕的居民")) return "害怕的居民";
        if (name.includes("憤怒的居民")) return "憤怒的居民";
        if (name.includes("居民甲")) return "居民甲";
        if (name.includes("居民乙")) return "居民乙";
        if (name.includes("居民")) return "居民";
        return "";
    })();
    // 只有劇情明確設定的 speaker，或本幕實際出現的角色立繪，才能決定說話人。

    );


    // 1. 一般劇情才切換背景；計分問題先保留上一幕畫面，讓題目介面疊上來。
if (!hasScoredOptions) {

    // 8. 問題介面直接顯示選項，不覆蓋上一幕的對話文字。

    // 提前載入所有可能接續的場景（包含題目分支），利用玩家閱讀對話的時間準備素材。
    const nextSceneIds = [];
    if (scene.nextId !== undefined) nextSceneIds.push(scene.nextId);
    if (Array.isArray(scene.options)) {
        scene.options.forEach(option => {
            if (option && option.nextId !== undefined) nextSceneIds.push(option.nextId);
        });
    }
    if (nextSceneIds.length === 0 && stepIndex + 1 < storyScript.length) {
        nextSceneIds.push(storyScript[stepIndex + 1].id);
    }

    const nextSceneIndexes = [...new Set(nextSceneIds)]
        .map(id => storyScript.findIndex(item => Number(item.id) === Number(id)))
        .filter(index => index >= 0 && index < storyScript.length);

    // 先準備下一步，再順手預備下一步後的線性場景；不阻擋目前畫面操作。

            if (upcoming && upcoming.nextId !== undefined) {

                if (followingIndex >= 0) preloadSceneAssets(followingIndex);

    }, 0);

    // 一般劇情才依照本幕文字更新對話框；問題介面保留上一幕畫面。
    if (!hasScoredOptions) {
        const shouldShowDialog = typeof scene.text === "string" && scene.text.trim().length > 0;
        const dialogParts = [
            document.getElementById("對話框"),
            document.getElementById("對話框那條線"),
            document.querySelector("#page1 .player-svg")

        dialogParts.forEach(element => {

            element.style.setProperty("display", shouldShowDialog ? "" : "none", shouldShowDialog ? "" : "important");

        // 只在第一次出現有文字的普通對話框時顯示教學提示。
        if (shouldShowDialog && !window.hasShownDialogueHint) {
            const pageForHint = document.getElementById("page1");
            if (pageForHint) pageForHint.classList.add("show-dialogue-hint");
            window.hasShownDialogueHint = true;
        }
    }

        function updateCharacterAnimation(characterId) {
    const charElement = document.getElementById(characterId);
    if (!charElement) return;

    // 清除舊動畫 Class 並重置
    charElement.classList.remove('anim-bounce', 'anim-sway', 'anim-depress', 'anim-cry', 'anim-nod', 'anim-excited', 'anim-passion-fire', 'anim-passion-normal', 'anim-crowned-king');
    void charElement.offsetWidth; // 強制重繪 (Reflow)

    // 依角色加入對應的單次動畫；已由 playCuriousAnim / playHappyJumpAnim 處理的角色不重複加入。
    switch (characterId) {
        case '熱情星出場火焰':
            charElement.classList.add('anim-passion-fire');
            break;
        case '熱情星戴上王冠':

        case '星辰微笑':
        case '星辰感動':
        case '好奇星開心閉眼':
        case '同情星感動':
        case '爽快星開心':
        case '爸爸微笑':
        case '媽媽微笑':
            charElement.classList.add('anim-bounce');

        case '星辰思考':
        case '同情星':
        case '爽快星疑惑':
        case '爸爸':
        case '媽媽':
            charElement.classList.add('anim-sway');
            break;

        case '熱情星':
        case '熱情星正常':
            charElement.classList.add('anim-passion-normal');
            break;

        case '星辰苦惱':
        case '同情星苦惱':
        case '爽快星害怕':
        case '爽快星慌張':
            charElement.classList.add('anim-depress');
            break;

        case '好奇星哭':
        case '好奇星哭小尾巴':
        case '爸爸難過':

        case '路人好奇星張嘴':
        case '路人好奇星閉嘴':
        case '同情星自信':

            break;
        default:
            // 已由 playCuriousAnim / playScaredAnim / playNodAnim 處理的角色不再疊加動畫。
            if ([
                '星辰', '星辰害怕', '星辰嚇死', '星辰驕傲', '星辰點頭',
                '一群好奇星', '好奇星', '好奇星開心', '好奇星會跳',
                '好奇星有尾巴', '好奇星開心有尾巴'
            ].includes(characterId)) break;
            // 其他尚未指定動畫的立繪，至少播放一次輕快彈跳。
            charElement.classList.add('anim-bounce');
            break;
    }
}
        // 依照拼圖內文字範圍自動調整字級：先用最大字，放不下才逐步縮小。
        function fitPuzzleOptionText(textSpan) {
            if (!textSpan) return;
            const label = textSpan.parentElement;
            if (!label) return;
            const maxFontSize = parseFloat(getComputedStyle(label).fontSize) || 30;
            const minFontSize = 12;
            textSpan.style.fontSize = maxFontSize + 'px';

            requestAnimationFrame(() => {
                let size = maxFontSize;
                while (size > minFontSize &&
                    (textSpan.scrollHeight > label.clientHeight + 1 ||
                     textSpan.scrollWidth > label.clientWidth + 1)) {
                    size -= 1;
                    textSpan.style.fontSize = size + 'px';
                }
            });
        }

        // 玩家點選拼圖後，先進入確認畫面；只有按「是的」才正式計分並前往 nextId。
        let pendingPuzzleConfirmation = null;

        function showPuzzleConfirmation(option, scene, colorName) {
            const page = document.getElementById('page1');
            const optBox = document.getElementById('選項框');
            if (!page || !option || !scene) return;

            pendingPuzzleConfirmation = { option, scene };

            // 進入「看選項內容／確認選項」畫面時，隱藏第一幕的星辰苦惱立繪。
            const thinkingStar = document.getElementById('星辰苦惱-選項用');
            if (thinkingStar) thinkingStar.style.display = 'none';

            // 先收起選擇介面的素材，再顯示確認介面。
            document.querySelectorAll('#page1 .ui').forEach(el => {
                el.style.display = 'none';
            });
            if (optBox) optBox.style.display = 'none';
            page.classList.add('puzzle-confirm-mode');

            const backgroundId = colorName === '粉色' ? '紅色背景' : colorName + '背景';
            const selectedOptionId = colorName + '選項';
            [backgroundId, '黑色紙', selectedOptionId, '確認選項背景', '是的', '我再想想'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    activateImages(el);
                    el.style.display = 'block';
                }
            });

            const selectedOption = document.getElementById(selectedOptionId);
            if (selectedOption) {
                const label = selectedOption.querySelector('.拼圖選項文字');
                if (label) {
                    // 支援 //n 或 \\n 作為手動換行標記，並用獨立文字層測量，避免長文字超出拼圖框。
                    const optionText = (option.text || '').replace(/\/\/n|\\n/g, String.fromCharCode(10));
                    label.textContent = '';
                    const textSpan = document.createElement('span');
                    textSpan.textContent = optionText;
                    label.appendChild(textSpan);

                    // 先依選項內容決定 430px 設計寬度下的字級，再按遊戲畫面實際寬度等比例縮放。
                    // 小螢幕的字會同步縮小，避免拼圖選項被擠到一直換行；原本各選項的字級比例保留。
                    const compactOptionText = optionText.replace(/\s/g, '');
                    label.style.fontSize = '';
                    let designFontSize = 48;
                    if ([
                        '當一個充滿想像力，有自我思考的人。',
                        '當一個樂觀開朗，願意協助大家的人。',
                        '當一個細心的領袖，帶大家前進的人。',
                        '當一個有完美規範，有完美秩序的人。'
                    ].includes(compactOptionText)) {
                        designFontSize = 38;
                    } else if (compactOptionText === '嘗試先修理發電機') {
                        designFontSize = 43;
                    } else if (compactOptionText === '分配任務，看看能用的道具') {
                        designFontSize = 45;
                    } else if (compactOptionText.length >= 13 && compactOptionText.length <= 15) {
                        designFontSize = 40;
                    } else if (compactOptionText.length === 6 || compactOptionText.length === 5) {
                        designFontSize = 55;
                    } else if (compactOptionText.length === 4) {
                        designFontSize = 55;
                        textSpan.style.position = 'relative';
                        textSpan.style.top = '2%';
                    } else if (compactOptionText === '抱怨自己運氣不好') {
                        designFontSize = 48;
                    }

                    // 11、12、13 個字的選項統一再縮小 4px。
                    if ([11, 12, 13].includes(compactOptionText.length)) {
                        designFontSize -= 4;
                    }

                    const gameContainer = document.getElementById('game-container');
                    const widthScale = gameContainer ? Math.min(1, gameContainer.clientWidth / 430) : 1;
                    textSpan.style.fontSize = (designFontSize * widthScale) + 'px';
                }
                selectedOption.onclick = null;
            }

            const yesButton = document.getElementById('是的');
            const rethinkButton = document.getElementById('我再想想');

            if (yesButton) {
                // 明確重新綁定「是的」：確認目前選項並繼續劇情。
                yesButton.onclick = function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (sceneTransitionLoading) return;
                    const pending = pendingPuzzleConfirmation;
                    if (!pending) return;

                    // 先保留待確認資料，再清除確認狀態，避免被其他點擊事件當成「我再想想」。
                    pendingPuzzleConfirmation = null;
                    page.classList.remove('puzzle-confirm-mode');

                    // 隱藏確認畫面的所有素材，避免舊選項殘留在下一幕。
                    document.querySelectorAll('#page1 .ui').forEach(el => {
                        el.style.display = 'none';
                    });
                    const optBox = document.getElementById('選項框');
                    if (optBox) optBox.style.display = 'none';

                    // 「是的」必須依照所選選項的 nextId 直接跳轉，不回到選擇畫面。
                    const nextIndex = storyScript.findIndex(s =>
                        Number(s.id) === Number(pending.option.nextId)
                    );
                    if (nextIndex === -1) {
                        console.error('找不到選項 nextId 對應的劇情：', pending.option.nextId);
                        return;
                    }

                    // 分數只在確認「是的」時加入，並避免重複計分。
                    if (pending.option.score && !scoredSceneIds.has(pending.scene.id)) {
                        for (const character in pending.option.score) {
                            scores[character] = (scores[character] || 0) + pending.option.score[character];
                        }
                        scoredSceneIds.add(pending.scene.id);
                    }

                    // 立刻收起選項畫面使用的星辰苦惱立繪，避免下一幕素材預載期間殘留在畫面上。
                    ['星辰苦惱', '星辰苦惱-選項用'].forEach(id => {
                        const character = document.getElementById(id);
                        if (character) character.style.display = 'none';
                    });

                    currentStep = nextIndex;
                    renderScene(currentStep);
                };
            }

            if (rethinkButton) {
                rethinkButton.onclick = (e) => {
                    e.stopPropagation();
                    if (sceneTransitionLoading) return;
                    pendingPuzzleConfirmation = null;
                    page.classList.remove('puzzle-confirm-mode');
                    renderOptions(scene);
                };
            }
        }

                .split('//n').join(String.fromCharCode(10))
                .split('\\n').join(String.fromCharCode(10))
                .trim();
            questionTitle.replaceChildren();
            if (titleText) {
                // 所有題目的橘色關鍵詞統一由這份清單控制。
                const highlightTerms = [
                    '陌生環境','困境','困住','修理任務','未來的自己','異常','哭泣時','原因','做回自己','行程',
                    '混亂的信件','變得很多','怎麼安排？','激烈爭執','拯救','混亂','真的假的'
                ];

                let textToHighlight = titleText;

                // 將文字中的換行符號直接建立成 <br>，不依賴 CSS 是否保留文字換行。
                const appendTitleText = (text) => {
                    String(text).split(/\r?\n/).forEach((line, index) => {
                        if (index > 0) questionTitle.append(document.createElement('br'));
                        questionTitle.append(document.createTextNode(line));
                    });
                };

                // 「初次來到陌生環境」仍固定在「初次」後換行；
                // 換行後的文字也使用 highlightTerms 決定哪些詞要變橘色。
                if (titleText.includes('初次來到陌生環境')) {
                    const titleStart = titleText.indexOf('初次來到陌生環境');
                    appendTitleText(titleText.slice(0, titleStart) + '初次');
                    questionTitle.append(document.createElement('br'));
                    textToHighlight = titleText.slice(titleStart + '初次'.length);
                }

                const term = highlightTerms
                    .filter(word => textToHighlight.includes(word))
                    .sort((a, b) => b.length - a.length)[0];

                if (term) {
                    const termStart = textToHighlight.indexOf(term);
                    appendTitleText(textToHighlight.slice(0, termStart));
                    const highlight = document.createElement('span');
                    highlight.className = 'question-title-highlight';
                    highlight.textContent = term;
                    questionTitle.append(highlight);
                    appendTitleText(textToHighlight.slice(termStart + term.length));
                } else {
                    // 沒有命中 highlightTerms 的文字全部維持原色，不再自動把句尾染橘色。
                    appendTitleText(textToHighlight);

        }

        // 隱藏原本四條橫向選項
        optBox.style.display = 'none';

        // 動畫只在第一次進入這個問題畫面時播放；按「我再想想」不重新播放。
        const questionPage = document.getElementById('page1');

        if (questionPage && !questionPage.classList.contains('question-animation-played') && questionBg) {

        // 畫面上的選項順序：第一個綠色、第二個藍色，接著紫色、粉色。
        // 素材可能是整張透明畫布，不能直接用最上層圖片當成點擊結果；
        // 先依圖片透明像素判斷使用者實際點到哪一塊拼圖。
        const puzzleEntries = [
            { id: '綠色拼圖', color: '綠色', optionIndex: 0 },
            { id: '藍色拼圖', color: '藍色', optionIndex: 1 },
            { id: '紫色拼圖', color: '紫色', optionIndex: 2 },
            { id: '粉色拼圖', color: '粉色', optionIndex: 3 }
        ];
        const puzzleAlphaCache = new WeakMap();

        function puzzlePixelIsVisible(img, clientX, clientY) {
            if (!img || !img.complete || !img.naturalWidth || !img.naturalHeight) return false;
            const rect = img.getBoundingClientRect();
            if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) return false;

            let canvas = puzzleAlphaCache.get(img);
            if (!canvas) {
                canvas = document.createElement('canvas');
                // 透明像素判定只需縮圖取樣，避免高解析拼圖在 iPhone 上建立超大 Canvas 導致 Safari 閃退。
                const scale = Math.min(1, 256 / Math.max(img.naturalWidth, img.naturalHeight));
                canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
                canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                if (!ctx) return false;
                try {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    puzzleAlphaCache.set(img, canvas);
                } catch (_) {
                    return false;
                }
            }

            const x = Math.min(canvas.width - 1, Math.max(0, Math.floor((clientX - rect.left) / rect.width * canvas.width)));
            const y = Math.min(canvas.height - 1, Math.max(0, Math.floor((clientY - rect.top) / rect.height * canvas.height)));
            try {
                return canvas.getContext('2d', { willReadFrequently: true }).getImageData(x, y, 1, 1).data[3] > 24;
            } catch (_) {
                return false;
            }
        }

        // 只有滑鼠移到拼圖實際不透明的圖案上，才顯示可點擊游標。
        // 透明區域與畫面其他地方一律維持一般游標。
        const updatePuzzleCursor = (clientX, clientY) => {
            const isOverPuzzle = puzzleEntries.some(entry => {
                if (entry.optionIndex >= scene.options.length) return false;
                const img = document.querySelector('#' + entry.id + ' img');
                return img && img.parentElement.style.display !== 'none' &&
                    puzzlePixelIsVisible(img, clientX, clientY);
            });
            puzzleEntries.forEach(entry => {
                const puzzle = document.getElementById(entry.id);
                if (!puzzle) return;
                puzzle.style.cursor = isOverPuzzle ? 'pointer' : 'default';
                const img = puzzle.querySelector('img');
                if (img) img.style.cursor = isOverPuzzle ? 'pointer' : 'default';
            });
        };

        const puzzleStage = document.getElementById('page1');
        if (puzzleStage) {
            puzzleStage.onmousemove = (e) => updatePuzzleCursor(e.clientX, e.clientY);
            puzzleStage.onmouseleave = () => updatePuzzleCursor(-1, -1);
        }

        puzzleEntries.forEach(({ id, color, optionIndex }) => {
            const puzzle = document.getElementById(id);
            if (!puzzle) return;
            puzzle.onclick = null;

            if (optionIndex >= scene.options.length) {
                puzzle.style.display = 'none';
                return;
            }

            puzzle.style.display = 'block';
            const chooseThisPuzzle = (e) => {
                e.preventDefault();
                e.stopPropagation();

                // 由畫面順序檢查點擊座標落在哪張拼圖的不透明區域。
                const hit = puzzleEntries.find(entry => {
                    if (entry.optionIndex >= scene.options.length) return false;
                    const img = document.querySelector('#' + entry.id + ' img');
                    return img && img.parentElement.style.display !== 'none' &&
                        puzzlePixelIsVisible(img, e.clientX, e.clientY);
                });

                // 點在所有拼圖的不透明圖案以外時，完全不觸發任何反應。
                if (!hit) return;
                showPuzzleConfirmation(scene.options[hit.optionIndex], scene, hit.color);

            };
            puzzle.onclick = chooseThisPuzzle;
            const puzzleImage = puzzle.querySelector('img');
            if (puzzleImage) puzzleImage.onclick = chooseThisPuzzle;
        });

        return;
    }

    // 沒有 score：維持原本的四條橫向選項
    optBox.innerHTML = '';

    scene.options.forEach(opt => {
        const btn = document.createElement('div');
        btn.className = '選項按鈕';

        if (opt.text.length > 12) {

        } else {

        }

        // 只將文字本身往下移 4px，按鈕位置與大小維持不變。
        const optionLabel = document.createElement('span');
        optionLabel.textContent = String(opt.text || '').replace(/\/\/n|\\n/g, String.fromCharCode(10));
        optionLabel.style.display = 'inline-block';
        optionLabel.style.transform = 'translate(-1px, 1px)';
        btn.appendChild(optionLabel);

        btn.onclick = (e) => {
            e.stopPropagation();

        };

        optBox.appendChild(btn);
    });

    optBox.style.display = 'flex';
}
        

        function selectOption(option, currentScene) {
            if (sceneTransitionLoading) return;
            if (option.score && !scoredSceneIds.has(currentScene.id)) {
                for (let character in option.score) {
                    scores[character] = (scores[character] || 0) + option.score[character];
                }
                scoredSceneIds.add(currentScene.id);
            }

            const nextIndex = storyScript.findIndex(s => s.id === option.nextId);
            if (nextIndex !== -1) {
                currentStep = nextIndex;
                renderScene(currentStep);
            }
        }
        
        function nextStep() {
            // 目前場景還在載素材時，任何點擊都不能推進或跳過對話。
            if (sceneTransitionLoading) return;
            const scene = storyScript[currentStep];
            if (scene && Number(scene.id) === 8) return;

            if (window.isTyping) {
                if (window.myTypingTimer) {
                    clearInterval(window.myTypingTimer);
                    window.myTypingTimer = null;
                }
                window.isTyping = false;
                const textBox = document.getElementById("對話文本");
                if (textBox) textBox.innerHTML = window.currentFullText;
                renderOptions(scene);
                return;
            }

            if (scene && scene.options && scene.options.length > 0) return;

            if (scene && scene.nextId !== undefined) {
                currentStep = storyScript.findIndex(s => s.id === scene.nextId);
            } else {
                currentStep++;
            }

            if (currentStep < storyScript.length && currentStep !== -1) {
                renderScene(currentStep);
            }
        }

        // 確認畫面期間，只允許點到兩個按鈕圖案本身；透明區與其他位置全部攔截。
        const confirmButtonCanvases = new WeakMap();
        function isInsideVisibleConfirmButton(buttonId, clientX, clientY) {
            const button = document.getElementById(buttonId);
            const img = button && button.querySelector('img');
            if (!img || !img.complete || !img.naturalWidth || !img.naturalHeight) return false;

            const rect = img.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0 ||
                clientX < rect.left || clientX > rect.right ||
                clientY < rect.top || clientY > rect.bottom) return false;

            let canvas = confirmButtonCanvases.get(img);
            if (!canvas) {
                canvas = document.createElement('canvas');
                // 確認按鈕也用縮圖取樣，避免 iPhone Safari 配置過大的 Canvas。
                const scale = Math.min(1, 256 / Math.max(img.naturalWidth, img.naturalHeight));
                canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
                canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                if (!ctx) return false;
                try {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    confirmButtonCanvases.set(img, canvas);
                } catch (_) {
                    return false;
                }
            }

            const x = Math.min(canvas.width - 1, Math.max(0, Math.floor((clientX - rect.left) / rect.width * canvas.width)));
            const y = Math.min(canvas.height - 1, Math.max(0, Math.floor((clientY - rect.top) / rect.height * canvas.height)));
            try {
                return canvas.getContext('2d', { willReadFrequently: true }).getImageData(x, y, 1, 1).data[3] > 24;
            } catch (_) {
                return false;
            }
        }

        document.addEventListener('click', function (e) {
            const activePage = document.getElementById('page1');
            if (!activePage || !activePage.classList.contains('puzzle-confirm-mode')) return;

            // 不依賴 e.target：按鈕可能被其他圖層蓋住，導致真正的按鈕 onclick 收不到事件。
            // 直接用點擊座標判斷命中的可見按鈕圖案，再執行對應功能。
            const buttonIds = ['是的', '我再想想'];
            let hitButtonId = buttonIds.find(id =>
                isInsideVisibleConfirmButton(id, e.clientX, e.clientY)
            );

            if (hitButtonId) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();

                const button = document.getElementById(hitButtonId);
                if (button && typeof button.onclick === 'function') {
                    button.onclick.call(button, e);
                }
                return;
            }

            // 背景、透明區、其他畫面元素一律不觸發任何操作。
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
        }, true);

        // 一般劇情點擊事件
        document.addEventListener('click', function (e) {

            // 第一次點擊時收起「點擊推動劇情」提示；箭頭之後仍會留在一般對話畫面。
            const pageForHint = document.getElementById('page1');
            if (pageForHint && pageForHint.classList.contains('scene-assets-loading')) return;
            if (pageForHint && pageForHint.classList.contains('show-dialogue-hint')) {
                pageForHint.classList.remove('show-dialogue-hint');
            }
            if (pageForHint && pageForHint.classList.contains('show-empty-scene-hint')) {
                pageForHint.classList.remove('show-empty-scene-hint');
            }
            const emptyHintElement = document.getElementById('empty-scene-next-hint');
            if (emptyHintElement) emptyHintElement.style.display = 'none';

            // 第二階段是確認畫面：背景任意位置都不能推進劇情。
            // 「我再想想」與「是的」各自的 onclick 會自行處理，且會停止冒泡。
            const activePage = document.getElementById('page1');
            if (activePage && activePage.classList.contains('puzzle-confirm-mode')) return;

            const menuContainer = document.querySelector('.menu-container');
            const wrapper = document.getElementById("menu-items-wrapper");
            if (menuContainer && !menuContainer.contains(e.target) && wrapper) {
                wrapper.classList.remove('open');
            }

            if (e.target.closest('.menu-container') || 
                e.target.closest('.選項按鈕') || 
                e.target.closest('#player-name-input') ||
                e.target.closest('.nav-item') ||
                e.target.closest('#askname-item')) {
                return; 
            }

            nextStep();
        });

        // 必須等兩個自訂字體都成功載入後，才開始載入遊戲素材。
        function preloadGameFonts() {
            if (typeof FontFace !== "function" || !document.fonts) {
                return Promise.reject(new Error("這個瀏覽器不支援自訂字體載入確認"));
            }

            const fontFiles = [
                new FontFace(
                    "Dela Gothic One",
                    'url("./font/DelaGothicOne-Regular.woff?v=6")',
                    { weight: "400", style: "normal" }
                ),
                new FontFace(
                    "CPTrans",
                    'url("./font/CP--TRANS.woff2?v=6")',
                    { weight: "400", style: "normal" }
                )
            ];

            const fontLoad = Promise.all(fontFiles.map(fontFace =>
                fontFace.load().then(loadedFace => {
                    document.fonts.add(loadedFace);
                    return loadedFace;
                }).catch(error => {
                    throw new Error("字體「" + fontFace.family + "」載入失敗：" +
                        (error && error.message ? error.message : "請檢查字體檔案與路徑"));
                })
            )).then(() => {
                if (!document.fonts.check('50px "Dela Gothic One"') ||
                    !document.fonts.check('16px "CPTrans"')) {
                    throw new Error("字體檔已讀取，但瀏覽器仍未確認字體可用");
                }
            });

            // 字體網路請求若一直沒有回應，最多等待 20 秒，避免永遠卡在「正在連結」。
            const fontTimeout = new Promise((_, reject) => {
                setTimeout(() => reject(new Error("自訂字體載入超過 20 秒")), 20000);
            });
            return Promise.race([fontLoad, fontTimeout]);
        }

        function showFontLoadError(error) {
            // 不另外顯示「字體載入失敗」錯誤畫面；仍保留原本載入畫面。
            // 字體未成功載入前不會啟動遊戲，錯誤原因可在開發者工具 Console 查看。
            console.error("自訂字體載入失敗，遊戲暫停啟動：", error);
        }

        window.addEventListener('DOMContentLoaded', () => {
            hideAllCharacters();

            // 必須先成功載入兩個自訂字體，才開始載入第一幕素材。
            preloadGameFonts().catch(error => {
                // 字體載入失敗或逾時時，記錄原因並使用系統備用字體啟動，避免遊戲永遠卡在「正在連結」。
                showFontLoadError(error);
            }).then(() => {
                // 開場只載入第一幕需要的素材；題目 UI 會在進入題目時再載入，避免開頭等待所有題目圖片。
                const initialAssets = [
                    ...getSceneAssetPaths(0)
                ];

                const loadingScreen = document.getElementById('loading-screen');
                const loadingMessage = loadingScreen &&
                    (loadingScreen.querySelector('.loading-message') || loadingScreen.querySelector('div'));
                const loadingPercent = document.getElementById('loading-percent');
                let retryCount = 0;
                const maxInitialAssetRetries = 1;
                let firstSceneStarted = false;

                function startFirstScene() {
                    if (firstSceneStarted) return;
                    firstSceneStarted = true;
                    readySceneIndexes.add(0);
                    enterGameAnimation();
                    renderScene(0);
                }

                function loadInitialAssets() {
                    if (loadingMessage) {
                        loadingMessage.classList.add('loading-message');
                        loadingMessage.textContent = retryCount === 0
                            ? '正在載入遊戲素材...'
                            : '圖片載入較慢，正在重試...';
                    }

                    preloadImages(initialAssets, error => {
                        if (error) {
                            console.warn("第一幕圖片載入未完成：", error);

                            // 清除逾時圖片的失敗快取，讓有限次重試能重新建立 Image。
                            const prefix = '圖片載入逾時：';
                            if (error.message && error.message.startsWith(prefix)) {
                                assetLoadPromises.delete(error.message.slice(prefix.length));
                            }

                            if (retryCount < maxInitialAssetRetries) {
                                retryCount++;
                                if (loadingPercent) {
                                    loadingPercent.textContent = '載入稍慢，正在重試（' + retryCount + '/' + maxInitialAssetRetries + '）';
                                }
                                setTimeout(loadInitialAssets, 800);
                                return;
                            }

                            // 不讓單張圖片的網路／解碼問題永久鎖死整個遊戲。
                            console.error("第一幕素材重試仍未完成，先繼續進入遊戲。");
                            if (loadingPercent) loadingPercent.textContent = '素材載入不完整，正在進入遊戲...';
                            startFirstScene();
                            return;
                        }

                        startFirstScene();
                    }, true);
                }

                loadInitialAssets();
            }).catch(showFontLoadError);
        });

        // 開發者工具：展開／收合角色劇情清單
function toggleDeveloperTools(event) {
    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }
    const panel = document.getElementById('developer-tools-panel');
    if (panel) panel.classList.toggle('open');
}

// 從各星球劇情的第一幕開始播放；使用 renderScene 保留原本素材載入流程。
function jumpToCharacterStory(sceneId, event) {
    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }
    const targetIndex = storyScript.findIndex(scene => Number(scene.id) === Number(sceneId));
    const panel = document.getElementById('developer-tools-panel');
    if (panel) panel.classList.remove('open');

    if (targetIndex === -1) {
        alert('找不到這個角色的劇情起點：' + sceneId);
        return;
    }

    // 清除可能殘留的輸入視窗，並讓場景使用原本的載入／轉場機制。
    if (typeof hideInputBox === 'function') hideInputBox();
    currentStep = targetIndex;
    renderScene(currentStep);
}

// 跳轉// 在 <script> 底部加入這段代碼即可
document.addEventListener('keydown', function(e) {
    // 按下小寫或大寫 J 鍵 (Jump)
    if (e.key === 'j' || e.key === 'J') {
        // 防止在文字輸入框（如玩家命名）打字時誤觸
        if (document.activeElement.tagName === 'INPUT') return;

        const targetId = prompt("【開發者跳轉】請輸入 Scene ID (例如: 8, 20.1, 78):");
        if (targetId !== null && targetId.trim() !== "") {
            const numId = Number(targetId);
            const targetIndex = storyScript.findIndex(s => Number(s.id) === numId);

            if (targetIndex !== -1) {
                currentStep = targetIndex;
                renderScene(currentStep);
                console.log(`成功跳轉至 Scene ID: ${numId}`);
            } else {
                alert(`找不到 ID 為 ${targetId} 的劇情！`);
            }
        }
    }
});

document.addEventListener('contextmenu', event => event.preventDefault());
document.addEventListener('dragstart', function(e) {
    if (e.target.tagName === 'IMG') {
        e.preventDefault();
    }
});

// 全域變數用來儲存淡入淡出的計時器
window.bgmFadeTimer = null;

/**
 * 播放背景音樂（支援自動淡入）
 * @param {string} audioSrc - 音響檔案路徑
 * @param {number} targetVolume - 目標音量 (0.0 ~ 1.0)
 * @param {number} fadeInDuration - 淡入時間（毫秒），預設 1500ms
 */
window.pendingBGMSource = window.pendingBGMSource || null;

// 手機切到其他 App、鎖定螢幕或頁面進入背景時，立即暫停背景音樂。
window.bgmWasPlayingBeforeHidden = false;
window.pauseBGMWhenBackgrounded = function () {
    const player = document.getElementById('bgm-player');
    if (!player) return;
    if (!player.paused && !window.isMuted) window.bgmWasPlayingBeforeHidden = true;
    if (window.bgmFadeTimer) {
        clearInterval(window.bgmFadeTimer);
        window.bgmFadeTimer = null;
    }
    player.pause();
};
document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
        window.pauseBGMWhenBackgrounded();
    } else {
        // 回到遊戲畫面時不自動播放；由玩家下一次操作時再解鎖播放。
        window.bgmWasPlayingBeforeHidden = false;
    }
});
window.addEventListener('pagehide', window.pauseBGMWhenBackgrounded);
window.addEventListener('blur', function () {
    // 手機瀏覽器切到背景時通常也會觸發 blur，作為額外保險。
    window.pauseBGMWhenBackgrounded();
});

document.addEventListener('pointerdown', function unlockBackgroundMusic() {
    const player = document.getElementById('bgm-player');
    if (player && player.paused && window.pendingBGMSource && !window.isMuted && !document.hidden) {
        playBGM(window.pendingBGMSource);
    }
}, true);

function playBGM(audioSrc, targetVolume = 0.5, fadeInDuration = 1500) {
    const bgmPlayer = document.getElementById('bgm-player');
    if (!bgmPlayer) return;

    window.pendingBGMSource = audioSrc;

    // 清除正在進行中的淡入淡出計時器
    if (window.bgmFadeTimer) clearInterval(window.bgmFadeTimer);

    // 如果已經在播放相同的音樂，僅調整目標音量
    if (bgmPlayer.getAttribute('src') === audioSrc && !bgmPlayer.paused) {
        bgmPlayer.volume = targetVolume;
        return;
    }

    // 設定新音樂來源與初始音量（從 0 開始淡入）
    bgmPlayer.src = audioSrc;
    bgmPlayer.volume = 0;
    
    const playPromise = bgmPlayer.play();
    if (playPromise !== undefined) {
        playPromise.then(() => {
            // 開始淡入效果
            const interval = 50;
            const step = targetVolume / (fadeInDuration / interval);

            window.bgmFadeTimer = setInterval(() => {
                if (bgmPlayer.volume + step < targetVolume) {
                    bgmPlayer.volume += step;
                } else {
                    bgmPlayer.volume = targetVolume; // 達到目標音量
                    clearInterval(window.bgmFadeTimer);
                    window.bgmFadeTimer = null;
                }
            }, interval);
        }).catch(err => {
            console.log("等待玩家點擊互動後播放音訊");
        });
    }
}

/**
 * 慢慢淡出並停止音樂
 * @param {number} fadeOutDuration - 淡出時間（毫秒），預設 1500ms
 */
function fadeOutBGM(fadeOutDuration = 1500) {
    const bgmPlayer = document.getElementById('bgm-player');
    if (!bgmPlayer || bgmPlayer.paused) return;

    // 清除正在進行中的淡入淡出計時器
    if (window.bgmFadeTimer) clearInterval(window.bgmFadeTimer);

    const startVolume = bgmPlayer.volume;
    const interval = 50;
    const step = startVolume / (fadeOutDuration / interval);

    window.bgmFadeTimer = setInterval(() => {
        if (bgmPlayer.volume - step > 0) {
            bgmPlayer.volume -= step;
        } else {
            // 音量歸零後停止播放
            bgmPlayer.pause();
            bgmPlayer.currentTime = 0;
            bgmPlayer.volume = startVolume; // 恢復預設音量備用
            clearInterval(window.bgmFadeTimer);
            window.bgmFadeTimer = null;
        }
    }, interval);
}

// 全域音量與靜音狀態控制
window.isMuted = false;

/**
 * 切換背景音樂靜音/取消靜音
 * @param {HTMLElement} btnEl - 音量按鈕元素
 */
function toggleBGM(btnEl) {
    const bgmPlayer = document.getElementById('bgm-player');
    
    // 切換靜音狀態
    window.isMuted = !window.isMuted;

    if (bgmPlayer) {
        bgmPlayer.muted = window.isMuted;
    }

    // 更新按鈕高亮樣式
    if (btnEl) {
        if (window.isMuted) {
            btnEl.classList.add('active'); // 靜音時顯示橘色高亮
        } else {
            btnEl.classList.remove('active'); // 取消靜音恢復預設
        }
    }
}

let loadedCount = 0;
const totalCritical = criticalAssets.length;

function preloadImages(array, callback) {
    if (!array || array.length === 0) return callback();

    array.forEach(src => {
        if (!src) {
            handleAssetLoaded(callback);
            return;
        }
        const img = new Image();
        img.src = src;
        img.onload = () => handleAssetLoaded(callback);
        img.onerror = () => {
            console.warn("圖片載入失敗:", src);
            handleAssetLoaded(callback);
        };
    });
}

function handleAssetLoaded(callback) {
    loadedCount++;
    let percent = Math.floor((loadedCount / totalCritical) * 100);
    requestAnimationFrame(() => updateUI(percent));
    if (loadedCount >= totalCritical && typeof callback === "function") {
        callback();
    }
}

function updateUI(p) {
    const bar = document.getElementById('progress-bar');
    const text = document.getElementById('loading-percent');
    if (bar) bar.style.width = p + "%";
    if (text) text.innerText = p + "%";
}

function enterGameAnimation() {
    const loadingScreen = document.getElementById('loading-screen');
    if (loadingScreen) {
        loadingScreen.style.transition = 'opacity 1s ease';
        loadingScreen.style.opacity = '0';
        setTimeout(() => {
            loadingScreen.style.display = 'none';
        }, 1000);
    }
}

// 💬 打字機效果（確保每一句都有打字效果）
// ==========================================
function startTypingEffect(text, callback) {
    const textTag = document.getElementById("對話文本");
    if (!textTag) return;

    if (window.myTypingTimer) {
        clearInterval(window.myTypingTimer);
        window.myTypingTimer = null;
    }

    // ⭕ 只將 {playerName} 替換為純玩家輸入的名字，不帶「星辰·」
    let formattedText = (text || "")
        .replace(/\{playerName\}/g, window.playerName || "")
        .replace(/\(玩家名稱\)/g, window.playerName || "")
        .replace(/（玩家名稱）/g, window.playerName || "");

    window.currentFullText = formattedText;
    window.isTyping = true;
    textTag.innerHTML = ""; 

    let index = 0;

    window.myTypingTimer = setInterval(() => {
        if (!window.isTyping) {
            clearInterval(window.myTypingTimer);
            window.myTypingTimer = null;
            return;
        }

        if (index < formattedText.length) {
            if (formattedText.charAt(index) === '<') {
                let tagBuffer = '';
                while (index < formattedText.length && formattedText.charAt(index) !== '>') {
                    tagBuffer += formattedText.charAt(index);
                    index++;
                }
                if (index < formattedText.length) {
                    tagBuffer += '>';
                    index++;
                }
                textTag.innerHTML += tagBuffer;
            } else {
                textTag.innerHTML += formattedText.charAt(index);
                index++;
            }
        } else {
            clearInterval(window.myTypingTimer);
            window.myTypingTimer = null;
            window.isTyping = false;
            
            if (typeof callback === "function") callback();
        }
    }, 40);
}

function renderOptions(scene) {
    const optBox = document.getElementById('選項框');
    if (scene && scene.options && optBox) {
        optBox.innerHTML = "";
        optBox.style.display = 'flex';

        // 🟢 1. 判斷是否為 ID 60，如果是就加上微調位置的 Class，否則移除
        if (Number(scene.id) === 60) {
            optBox.classList.add('id60-position');
        } else {
            optBox.classList.remove('id60-position');
        }

        scene.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt.text;
            btn.className = 'option-btn';

            // 🟢 2. ID 60 的按鈕小字體（你原本的邏輯）
            if (Number(scene.id) === 60) {
                btn.classList.add('small-text');
            }

            btn.onclick = (e) => {
                e.stopPropagation();
                selectOption(opt, scene);
            };
            optBox.appendChild(btn);
        });
    }
}
function setSpeaker(name) {

    if (speakerText) {
        speakerText.textContent = name;

}

// 🎬 5. 核心渲染機制 (renderScene - 修正說話者名字顯示)
// ==========================================
function renderScene(stepIndex) {
    const scene = storyScript[stepIndex];
    if (!scene) return;

    // --------------------------------------------------
    // ⭕ 判斷對話框是否有文字內容：無文字則隱藏整個對話框
    // --------------------------------------------------
    const dialogBox = document.getElementById('對話框');
    // 檢查是否有 text 且去除空白後不為空字串
    const hasText = scene.text && scene.text.trim() !== "";

    if (dialogBox) {
        if (!hasText) {
            dialogBox.classList.add('hide-dialog'); // 隱藏對話框
        } else {
            dialogBox.classList.remove('hide-dialog'); // 顯示對話框
        }
    }
    // 每次渲染新場景時強制停止舊的打字機
    if (window.myTypingTimer) {

    const speakerEl = document.getElementById('玩家');
    const svgTextEl = document.querySelector('.player-text');

    const currentSceneId = Number(scene.id);
// --------------------------------------------------

// --------------------------------------------------
if (scene.background) {

    document.querySelectorAll('.背景圖, .背景').forEach(el => {
        el.style.display = 'none';
    });

    // 2. 找到劇本指定的背景 ID 並將它顯示出來
    const targetBg = document.getElementById(scene.background);
    if (targetBg) {
        targetBg.style.display = 'block';
    } else {
        console.warn(`⚠️ 找不到 ID 為 "${scene.background}" 的背景元素`);
    }
}
    // --------------------------------------------------
    // 💡 修正說話者名字抓取邏輯
    // --------------------------------------------------
    // --------------------------------------------------
    // 💡 修正說話者名字抓取邏輯
    // --------------------------------------------------
    let displayName = "";
    
    if (scene.speaker) {
        // 1. 若劇本有明確寫 speaker，優先使用
        if (scene.speaker === "玩家") {
            displayName = window.playerName ? `${window.playerName} ・ 星辰` : "星辰";
        } else {
            displayName = scene.speaker;
        }
    } else if (scene.characters && scene.characters.length > 0) {
        // 2. 若沒寫 speaker，從 characters[0] 判斷說話者
        let charName = scene.characters[0];

        if (charName.includes("好奇星路人")) {
            displayName = "路人好奇星";
        } else if (charName.includes("好奇星們")) {
            displayName = "好奇星們";
        } else if (charName.includes("星辰")) {
            if (currentSceneId < 8) {
                displayName = "星辰";
            } else {
                displayName = window.playerName ? `${window.playerName} ・ 星辰` : "星辰";
            }
        } else if (charName.includes("好奇星")) {
            displayName = "好奇星";
        } else if (charName.includes("同情星")) {
            displayName = "同情星";
        } else if (charName.includes("熱情星")) {
            displayName = "熱情星";
        } else if (charName.includes("爽快星")) {
            displayName = "爽快星";
        } else {
            // 其他角色直接拿角色名稱前綴
            displayName = charName;
        }
    }

    // 更新 DOM 上的名字文字
    if (speakerEl) {
        speakerEl.innerText = displayName;
        speakerEl.setAttribute('data-text', displayName);
    }
    
    if (svgTextEl) {
        if (displayName.includes("・") && window.playerName) {
            svgTextEl.innerHTML = `${window.playerName}<tspan dx="6">・</tspan><tspan dx="6">星辰</tspan>`;
        } else {
            svgTextEl.textContent = displayName;
        }
    }

    // 依據說話者動態切換對話框樣式 (Color/Theme)
    if (pageEl) {
        // 1. 移除所有可能的舊 Class（加入新增的兩種）
        pageEl.classList.remove(
            'speaker-star', 
            'speaker-curious', 
            'speaker-curious-random-person', 
            'speaker-curious-group', 
            'speaker-sympathy', 
            'speaker-passion', 
            'speaker-refreshing'
        );

        // 2. 依照 displayName 派發全新的 Class
        if (displayName.includes("路人好奇星")) {
            pageEl.classList.add('speaker-curious-random-person');
        } else if (displayName.includes("好奇星們")) {
            pageEl.classList.add('speaker-curious-group');
        } else if (displayName.includes("星辰") || scene.speaker === "玩家") {
            pageEl.classList.add('speaker-star');
        } else if (displayName.includes("好奇星")) {
            pageEl.classList.add('speaker-curious');
        } else if (displayName.includes("同情星")) {
            pageEl.classList.add('speaker-sympathy');
        } else if (displayName.includes("熱情星")) {
            pageEl.classList.add('speaker-passion');
        } else if (displayName.includes("爽快星")) {
            pageEl.classList.add('speaker-refreshing');
        } else {
            pageEl.classList.add('speaker-star');
        }
    }

    // 8 號場景開啟輸入名字彈窗
    if (currentSceneId === 8) {
        showInputBox();
    } else {
        hideInputBox();
    }

    // 隱藏舊選項框
    const optBox = document.getElementById('選項框');
    if (optBox) optBox.style.display = 'none';

    // 顯示對應立繪
    hideAllCharacters();
    if (scene.characters && Array.isArray(scene.characters)) {
        scene.characters.forEach(charName => {
            const charEl = document.getElementById(charName);
            if (charEl) charEl.style.display = 'block';
        });
    }

    // 觸發特定動作動畫
    switch (currentSceneId) {
        case 0: 
        case 1:
            playScaredAnim("星辰害怕"); break;
        case 1.5:
        case 3:
        case 26:
            playScaredAnim("星辰嚇死"); break;
        case 2.1: 
        case 2.2:
        case 2.3: 
        case 2.4: 
        case 14:
            playSlideInAnim("星辰"); break;
        case 39:
        case 37:
            playNodAnim("星辰驕傲"); break;
        case 12: 
        case 100: 
        case 134:
            playNodAnim("星辰點頭"); break;
        case 30:
            playHappyJumpAnim("好奇星們"); break;
        case 5:
            playCuriousAnim("好奇星", "curious-bounce"); break;
        case 7:
            playCuriousAnim("好奇星開心", "curious-wiggle"); break;
        case 19:
            playCuriousAnim("好奇星會跳", "curious-pop"); break;
        case 40:
            playCuriousAnim("好奇星有尾巴", "curious-bounce"); break;
        case 41:
            playCuriousAnim("好奇星開心有尾巴", "curious-wiggle"); break;
    }

    // 開始打字效果
    startTypingEffect(scene.text, () => {
        renderOptions(scene);
    });
}

// 🔀 6. 劇情推進與選項處置 (包含防雙重觸發)
// ==========================================
function selectOption(option, currentScene) {
    if (option.score && !scoredSceneIds.has(currentScene.id)) {
        for (let character in option.score) {
            scores[character] = (scores[character] || 0) + option.score[character];
        }
        scoredSceneIds.add(currentScene.id);
    }

    const nextIndex = storyScript.findIndex(s => s.id === option.nextId);
    if (nextIndex !== -1) {
        currentStep = nextIndex;
        renderScene(currentStep);
    }
}

// ==========================================
// 🔀 6. 劇情推進與選項處置
// ==========================================
// ==========================================
// 🔀 劇情推進邏輯
// ==========================================
function nextStep() {
    // 點擊冷卻鎖，防止按太快
    if (isClickCooldown) return;

    const scene = storyScript[currentStep];

    // 特殊關卡：輸入名字不觸發點擊推進
    if (scene && Number(scene.id) === 8) return;

    // --------------------------------------------------
    // 【狀態 1】如果「還在打字中」-> 點擊第 1 下：變打完的樣子
    // --------------------------------------------------
    if (window.isTyping) {
        // 1. 立刻停止打字計時器
        if (window.myTypingTimer) {
            clearInterval(window.myTypingTimer);
            window.myTypingTimer = null;
        }
        
        // 2. 將狀態改為已完成打字
        window.isTyping = false;
        
        // 3. 把這句話「瞬間變完整」
        const textBox = document.getElementById("對話文本");
        if (textBox) {
            textBox.innerHTML = window.currentFullText;
        }
        
        // 4. 如果有選項，顯示選項
        renderOptions(scene);

        // 5. 加鎖 150 毫秒，防止這「第 1 下點擊」誤跳到下一句
        isClickCooldown = true;
        setTimeout(() => {
            isClickCooldown = false;
        }, 150);

        return; // 🔴 絕對不跳下一句！
    }

    // --------------------------------------------------
    // 【狀態 2】如果有選項在螢幕上 -> 點背景不能跳下一句
    // --------------------------------------------------
    if (scene && scene.options && scene.options.length > 0) {
        return;
    }

    // --------------------------------------------------
    // 【狀態 3】字已經打完了 -> 點擊第 2 下：進入下一句
    // --------------------------------------------------
    if (scene && scene.nextId !== undefined) {
        currentStep = storyScript.findIndex(s => s.id === scene.nextId);
    } else {
        currentStep++;
    }

    // 載入下一句（會重新觸發 startTypingEffect，從頭打字）
    if (currentStep < storyScript.length && currentStep !== -1) {
        renderScene(currentStep);
    }
}

function showInputBox() {

    const askBg = document.getElementById("問名字") || document.getElementById("問背景");
    if (askBg) {
        askBg.style.display = "block";

    const askItem = document.getElementById("askname-item");
    if (askItem) {
        askItem.style.display = "block"; // 強制顯示 display
        askItem.classList.remove("show");
        void askItem.offsetWidth; // 💡 強制瀏覽器重繪 (Reflow)
        askItem.classList.add("show");
    }

    // 3. 自動聚焦到輸入框
    setTimeout(() => {
        const input = document.getElementById("player-name-input");
        if (input) {
            input.focus();
        }
    }, 150);
}

function hideInputBox() {

    const askBg = document.getElementById("問名字") || document.getElementById("問背景");

    }

    if (askItem) {
        askItem.classList.remove("show");
        askItem.style.display = "none";
    }
}
function submitName() {

}

function playHappyJumpAnim(charId = '好奇星們') {
    const target = document.getElementById(charId);
    if (target && target.style.display !== 'none') {
        target.classList.remove('happy-jump'); 
        void target.offsetWidth; // 強制重繪（Reflow），確保重複觸發時能重新播放動畫
        target.classList.add('happy-jump');    
    }
}
function playSlideInAnim(charId = '星辰') {
    const target = document.getElementById(charId);
    if (target && target.style.display !== 'none') {
        target.classList.remove('slide-in-right'); 
        void target.offsetWidth; 
        target.classList.add('slide-in-right');    
    }
}

function playScaredAnim(charId) {
    const target = document.getElementById(charId);
    if (target && target.style.display !== 'none') {
        target.classList.remove('scared-bounce'); 
        void target.offsetWidth; 
        target.classList.add('scared-bounce');    
    }
}

function playCuriousAnim(charId, animType = 'curious-bounce') {
    const target = document.getElementById(charId);
    if (!target) return;

    target.classList.remove('curious-bounce', 'curious-wiggle', 'curious-pop', 'nod-head'); 
    void target.offsetWidth; 
    target.classList.add(animType); 
}

function playNodAnim(charId) {
    document.querySelectorAll('.全星辰').forEach(el => el.style.display = 'none');

    const target = document.getElementById(charId);
    if (!target) return;

    target.style.display = 'block'; 
    target.style.opacity = '1';
    target.classList.remove('nod-head', 'curious-bounce', 'scared-bounce');
    void target.offsetWidth; 
    target.classList.add('nod-head');
}

window.addEventListener('keydown', function (e) {

    if (e.key === '`' || e.key === '~' || e.key === 'F2') {

        // 彈出輸入框

            const targetIndex = storyScript.findIndex(s => String(s.id) === cleanId);

/* 主體直接讀取你的角色變數 */
/* 修改後的 #玩家 樣式 */
#玩家 {
    display: inline-block;
    position: relative;

    color: var(--theme-bg-color, #ffffff);
    
    /* 1. 粗體描邊 */
    -webkit-text-stroke: 30px var(--stroke-color, #000);

    /* 2. 強制轉角全變成圓角（解決突起） */
    stroke-linejoin: round !important;
    -webkit-stroke-linejoin: round !important;

    /* 3. 補上圓角邊緣限制 */
    stroke-linecap: round !important;

    paint-order: stroke fill;
}

/* 關閉導致延遲爆開的偽元素 */
#玩家::before,
#玩家::after {
    display: none !important;
}
/* CSS 設定 */
.player-text {
    font-size: 32px;
    font-family: 'Dela Gothic One', Arial, sans-serif;
    fill: var(--theme-bg-color, #ffffff);
    
    /* SVG 專用描邊 */
    stroke: var(--stroke-color, #141414);
    stroke-width: 10px;
    paint-order: stroke fill;

    /* 在 SVG 裡面，這兩行才會真正生效！ */
    stroke-linejoin: round;
    stroke-linecap: round;
}
.player-svg {
    position: relative; /* 必須搭配 relative / absolute / fixed */
    z-index: 9999;        /* 這樣就能跟外面的 HTML 爭奪圖層了 */
    
    /* 順便把原本的位移移到 SVG 上 */
    transform: translateX(50px) translateY(-95px);
    pointer-events: none;
}

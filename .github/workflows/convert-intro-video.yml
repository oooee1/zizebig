name: Convert intro video for iOS Safari

on:
  push:
    paths:
      - ".github/workflows/convert-intro-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Convert WebM to iOS-compatible MP4
        run: |
          ffmpeg -y -i "玩法介紹影片.webm" \
            -map 0:v:0 -an \
            -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" \
            -c:v libx264 -profile:v baseline -level 3.0 \
            -pix_fmt yuv420p -preset slow -crf 22 \
            -movflags +faststart "玩法介紹影片.mp4"
          test -s "玩法介紹影片.mp4"

      - name: Commit converted video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "玩法介紹影片.mp4"
          if git diff --cached --quiet; then
            echo "MP4 is already up to date."
          else
            git commit -m "Add iOS-compatible intro video"
            git push
          fi

name: Convert intro video for iOS Safari

on:
  push:
    paths:
      - ".github/workflows/convert-intro-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Convert WebM to iOS-compatible MP4
        run: |
          ffmpeg -y -i "玩法介紹影片.webm" \
            -map 0:v:0 -an \
            -vf "scale=w='if(gte(iw,ih),min(iw,1280),min(iw,720))':h='if(gte(iw,ih),min(ih,720),min(ih,1280))':force_original_aspect_ratio=decrease:force_divisible_by=2,fps=30,format=yuv420p" \
            -c:v libx264 -profile:v baseline -level:v 3.1 \
            -pix_fmt yuv420p -preset slow -crf 23 \
            -movflags +faststart "玩法介紹影片.mp4"
          test -s "玩法介紹影片.mp4"

      - name: Commit converted video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "玩法介紹影片.mp4"
          if git diff --cached --quiet; then
            echo "MP4 is already up to date."
          else
            git commit -m "Add iOS-compatible intro video"
            git pull --rebase origin main
            git push
          fi
